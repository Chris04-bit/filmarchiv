<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmarchiv – Login</title>
  <style>
    :root {
      --bg: #050507;
      --accent: #b57cff;
      --fg: #f5f5f7;
      --muted: #b4b4be;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: 
        radial-gradient(720px 520px at 92% 12%, rgba(47, 86, 255, 0.5), transparent 64%),
        radial-gradient(640px 560px at 0% 38%, rgba(132, 48, 230, 0.48), transparent 66%),
        var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      background: rgba(12, 12, 16, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1rem;
      padding: 2.5rem;
      width: min(380px, 92vw);
      backdrop-filter: blur(16px);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      text-align: center;
    }
    .subtitle {
      color: var(--muted);
      text-align: center;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      height: 2.9rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.4);
      color: var(--fg);
      padding: 0 1rem;
      font-size: 1rem;
      margin-bottom: 1.2rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(181, 124, 255, 0.25);
    }
    button {
      width: 100%;
      height: 2.9rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--accent);
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.1); }
    .error {
      background: rgba(255, 80, 80, 0.15);
      color: #ff6b6b;
      padding: 0.75rem;
      border-radius: 0.4rem;
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Filmarchiv</h1>
    <p class="subtitle">Bitte einloggen</p>

    <div class="error" id="error">Falscher Benutzername oder Passwort</div>

    <form method="POST" action="/login">
      <label for="username">Benutzername</label>
      <input type="text" id="username" name="username" value="admin" required autofocus>

      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Einloggen</button>
    </form>
  </div>

  <script>
    // Fehler anzeigen, wenn die URL ?error enthält
    if (window.location.search.includes('error')) {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
