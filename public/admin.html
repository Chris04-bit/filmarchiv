<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmarchiv – Admin</title>
  <style>
    :root {
      --bg: #050507;
      --surface: rgba(12, 12, 16, 0.78);
      --fg: #f5f5f7;
      --muted: #b4b4be;
      --accent: #b57cff;
      --line: rgba(255, 255, 255, 0.1);
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: 
        radial-gradient(720px 520px at 92% 12%, rgba(47, 86, 255, 0.4), transparent 64%),
        radial-gradient(640px 560px at 0% 38%, rgba(132, 48, 230, 0.35), transparent 66%),
        var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(5, 5, 7, 0.85);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      padding: 1rem;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 1rem; }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 1.2rem; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .nav-links a:hover { color: var(--fg); }

    h1 { font-size: 1.8rem; font-weight: 800; margin: 2rem 0 1.5rem; letter-spacing: -0.02em; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.2rem; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.75rem 0.5rem; border-bottom: 1px solid var(--line); }
    th { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    td { font-size: 0.95rem; }

    .actions { display: flex; gap: 0.5rem; }
    button, .btn {
      border: none;
      border-radius: 0.4rem;
      padding: 0.45rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.03em;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-danger { background: rgba(255, 107, 107, 0.15); color: var(--danger); }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--fg); }

    .form-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    input, select {
      height: 2.6rem;
      border-radius: 0.4rem;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.4);
      color: var(--fg);
      padding: 0 0.9rem;
      font: inherit;
      flex: 1;
      min-width: 140px;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }

    .empty { color: var(--muted); font-size: 0.9rem; }
    .badge { font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 999px; background: rgba(181,124,255,0.15); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <p class="brand">Filmarchiv · Admin</p>
      <div class="nav-links">
        <a href="/">Zur App</a>
        <a href="/logout">Logout</a>
      </div>
    </div>
  </header>

  <main class="wrap">
  <h1>Admin-Portal</h1>

  <!-- Benutzerverwaltung -->
  <div class="card">
    <h2>Neuen User anlegen</h2>
    <div class="form-row">
      <input type="text" id="new-username" placeholder="Benutzername">
      <input type="password" id="new-password" placeholder="Passwort">
      <select id="new-role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
      <button class="btn btn-primary" id="create-user">Anlegen</button>
    </div>
  </div>

  <div class="card">
    <h2>Bestehende User</h2>
    <div id="user-list">
      <p class="empty">Lade User...</p>
    </div>
  </div>

  <!-- Pack-Verwaltung -->
  <div class="card" style="margin-top: 3rem;">
    <h2>Neues Filmpaket anlegen</h2>
    <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem;">
      Die JSON-Datei muss manuell im Ordner <code>data/packs/</code> liegen.
    </p>
    <div class="form-row">
      <input type="text" id="pack-name" placeholder="Anzeigename (z.B. Top 250)">
      <input type="text" id="pack-filename" placeholder="Dateiname (z.B. top250.json)">
      <input type="text" id="pack-desc" placeholder="Kurzbeschreibung (optional)">
      <button class="btn btn-primary" id="create-pack">Pack anlegen</button>
    </div>
  </div>

  <div class="card">
    <h2>Vorhandene Filmpakete</h2>
    <div id="pack-list">
      <p class="empty">Lade Packs...</p>
    </div>
  </div>
</main>

  <script>
  // ========== USER ==========
  async function loadUsers() {
    const res = await fetch('/api/admin/users');
    const users = await res.json();
    const container = document.getElementById('user-list');

    if (!users.length) {
      container.innerHTML = '<p class="empty">Keine User vorhanden.</p>';
      return;
    }

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Benutzername</th>
            <th>Rolle</th>
            <th>Erstellt</th>
            <th>Aktionen</th>
          </tr>
        </thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td>${u.id}</td>
              <td>${u.username}</td>
              <td><span class="badge">${u.role}</span></td>
              <td>${new Date(u.created_at).toLocaleDateString('de-DE')}</td>
              <td class="actions">
                <button class="btn btn-secondary" onclick="changePassword(${u.id}, '${u.username}')">Passwort</button>
                <button class="btn btn-danger" onclick="deleteUser(${u.id}, '${u.username}')">Löschen</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  document.getElementById('create-user').addEventListener('click', async () => {
    const username = document.getElementById('new-username').value.trim();
    const password = document.getElementById('new-password').value;
    const role = document.getElementById('new-role').value;

    if (!username || !password) return alert('Benutzername und Passwort erforderlich');

    const res = await fetch('/api/admin/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, role })
    });

    if (!res.ok) {
      const err = await res.json();
      return alert(err.error || 'Fehler beim Anlegen');
    }

    document.getElementById('new-username').value = '';
    document.getElementById('new-password').value = '';
    loadUsers();
  });

  async function changePassword(id, username) {
    const password = prompt(`Neues Passwort für "${username}":`);
    if (!password) return;

    const res = await fetch(`/api/admin/users/${id}/password`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });

    if (res.ok) alert('Passwort wurde geändert');
    else alert('Fehler beim Ändern des Passworts');
  }

  async function deleteUser(id, username) {
    if (!confirm(`User "${username}" wirklich unwiderruflich löschen?\n\nAlle Filme dieses Users werden ebenfalls gelöscht.`)) return;

    const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
    if (res.ok) loadUsers();
    else {
      const err = await res.json();
      alert(err.error || 'Fehler beim Löschen');
    }
  }

  // ========== PACKS ==========
  async function loadPacks() {
    const res = await fetch('/api/admin/packs');
    const packs = await res.json();
    const container = document.getElementById('pack-list');

    if (!packs.length) {
      container.innerHTML = '<p class="empty">Noch keine Packs angelegt.</p>';
      return;
    }

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Dateiname</th>
            <th>Beschreibung</th>
            <th>Aktionen</th>
          </tr>
        </thead>
        <tbody>
          ${packs.map(p => `
            <tr>
              <td>${p.name}</td>
              <td><code>${p.filename}</code></td>
              <td>${p.description || '–'}</td>
              <td class="actions">
                <button class="btn btn-danger" onclick="deletePack(${p.id}, '${p.name}')">Löschen</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  document.getElementById('create-pack').addEventListener('click', async () => {
    const name = document.getElementById('pack-name').value.trim();
    const filename = document.getElementById('pack-filename').value.trim();
    const description = document.getElementById('pack-desc').value.trim();

    if (!name || !filename) return alert('Name und Dateiname sind erforderlich');

    const res = await fetch('/api/admin/packs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, filename, description })
    });

    if (!res.ok) {
      const err = await res.json();
      return alert(err.error || 'Fehler beim Anlegen');
    }

    document.getElementById('pack-name').value = '';
    document.getElementById('pack-filename').value = '';
    document.getElementById('pack-desc').value = '';
    loadPacks();
  });

  async function deletePack(id, name) {
    if (!confirm(`Pack "${name}" wirklich löschen?\n(Die JSON-Datei wird dabei nicht gelöscht)`)) return;

    const res = await fetch(`/api/admin/packs/${id}`, { method: 'DELETE' });
    if (res.ok) loadPacks();
    else alert('Fehler beim Löschen');
  }

  // Start
  loadUsers();
  loadPacks();
</script>
</body>
</html>
